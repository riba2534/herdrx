name: CI 与 Docker Hub 镜像发布

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herdrx-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 测试与部署配置检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.4.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 前端验证与 embed 资源
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web lint
          pnpm --dir web exec vitest run
          make web-build
      - name: Go 验证
        run: |
          go mod verify
          go vet ./...
          go test -count=1 -timeout=10m ./...
          go test -race -count=1 -timeout=10m ./...
          python3 scripts/build-dependency-notices.py --check
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          pnpm --dir web audit
      - name: 浏览器认证、管理、终端渲染与跨端显示
        run: |
          pnpm --dir web exec playwright install --with-deps chromium firefox webkit
          go build -o "$RUNNER_TEMP/herdrx-browser-test" ./cmd/herdrx-server
          node scripts/test-browser-auth.mjs "$RUNNER_TEMP/herdrx-browser-test"
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-tailcat-onboarding.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-keys-folders.mjs "$RUNNER_TEMP/herdrx-browser-test"
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-app-appearance.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-custom-controls.mjs
          node scripts/test-terminal-rendering.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-terminal-themes.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-workbench-display.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-composer.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-desktop-display.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-workbench-space.mjs
          node scripts/test-terminal-flicker.mjs
          node scripts/test-mobile-terminal-scroll.mjs
          HERDRX_TEST_ENGINES=chromium,firefox,webkit node scripts/test-pwa.mjs
      - name: 检查目录挂载与部署配置
        run: |
          python3 scripts/check-deployment.py
          python3 scripts/test-publish-images.py
          python3 scripts/test-cli-installer.py

  images:
    name: 构建并验收 ${{ matrix.arch }} 镜像
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: 构建当前架构镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: herdrx-server:ci-${{ matrix.arch }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=herdrx-${{ matrix.arch }}
          cache-to: type=gha,scope=herdrx-${{ matrix.arch }},mode=max
      - name: 验证 nonroot、目录挂载及容器重建
        env:
          CANDIDATE_IMAGE: herdrx-server:ci-${{ matrix.arch }}
          CANDIDATE_VERSION: sha-${{ github.sha }}
        run: python3 scripts/smoke-image.py "$CANDIDATE_IMAGE" "$CANDIDATE_VERSION"
      - name: 验证 Caddy HTTPS 与真实代理客户端限流
        env:
          CANDIDATE_IMAGE: herdrx-server:ci-${{ matrix.arch }}
        run: python3 scripts/test-caddy-auth.py "$CANDIDATE_IMAGE"
      - name: 导出已验证镜像
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CANDIDATE_IMAGE: herdrx-server:ci-${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker save -o "$RUNNER_TEMP/image/image.tar" "$CANDIDATE_IMAGE"
          cd "$RUNNER_TEMP/image"
          sha256sum image.tar > image.tar.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: image-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  publish:
    name: 发布到 Docker Hub
    needs: images
    if: github.repository == 'riba2534/herdrx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    env:
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      IMAGE_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/images
      - name: 校验并加载同一次运行的两种架构镜像
        run: |
          for arch in amd64 arm64; do
            cd "$RUNNER_TEMP/images/image-${arch}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
            sha256sum --check image.tar.sha256
            docker load -i image.tar
          done
      - name: 隔离发布凭据和输出
        run: |
          printf 'DOCKER_CONFIG=%s/dockerhub-auth\nPUBLISH_OUTPUT=%s/release\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          install -d -m 700 "$RUNNER_TEMP/dockerhub-auth"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: 登录 Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 推送、核对 digest 并更新 latest
        run: |
          bash scripts/publish-images.sh
          cat "$PUBLISH_OUTPUT/verification.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: herdrx-deploy-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90
