name: CLI GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '仅构建候选包（例如 v0.1.0-rc.1）；发布请推送对应版本标签'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cli-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: 验证 CLI 与安装器
        run: |
          go mod verify
          go vet ./...
          go test -count=1 -timeout=10m ./...
          go test -race -count=1 -timeout=10m ./...
          python3 scripts/test-cli-installer.py
      - name: 构建 Linux 双架构附件
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_SIGNING_KEY: ${{ secrets.HERDRX_RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$RELEASE_SIGNING_KEY"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/herdrx-signing.pem"
          unset RELEASE_SIGNING_KEY
          trap 'rm -f "$RUNNER_TEMP/herdrx-signing.pem"' EXIT
          python3 scripts/build-cli-release.py --version "$RELEASE_VERSION" --signing-key "$RUNNER_TEMP/herdrx-signing.pem" --out "$RUNNER_TEMP/cli-release"
      - name: 发布防护回归（隔离 GitHub 模拟环境）
        run: python3 scripts/test-publish-cli-release.py "$RUNNER_TEMP/cli-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release/
      - name: 校验附件并在当前 CPU 运行 CLI
        run: python3 scripts/verify-cli-release.py "$RUNNER_TEMP/cli-release"

  publish:
    needs: smoke
    if: github.repository == 'riba2534/herdrx' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release/
      - name: 上传草稿、下载校验并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: python3 scripts/publish-cli-release.py "$RUNNER_TEMP/cli-release" --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION"
